<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img"><title>Where drawdown's data comes from</title><desc>The browser talks only to drawdown's API. drawdown compiles with draft, submits through loom to Temporal, reads status from Temporal and records from warp. It never writes history itself.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="n"><rect x="250" y="30" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="45.0" text-anchor="middle" dominant-baseline="central">Browser</text><text class="t2" x="340.0" y="64.0" text-anchor="middle" dominant-baseline="central">React page, no build</text></g><path class="w" d="M340 78 L340 112" marker-end="url(#a)"/><g class="p"><rect x="220" y="116" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="131.0" text-anchor="middle" dominant-baseline="central">drawdown API</text><text class="t2" x="340.0" y="150.0" text-anchor="middle" dominant-baseline="central">read and submit only</text></g><g class="p"><rect x="30" y="230" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="100.0" y="245.0" text-anchor="middle" dominant-baseline="central">draft</text><text class="t2" x="100.0" y="264.0" text-anchor="middle" dominant-baseline="central">compile</text></g><g class="p"><rect x="190" y="230" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="260.0" y="245.0" text-anchor="middle" dominant-baseline="central">loom</text><text class="t2" x="260.0" y="264.0" text-anchor="middle" dominant-baseline="central">submit a run</text></g><g class="p"><rect x="350" y="230" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="420.0" y="245.0" text-anchor="middle" dominant-baseline="central">Temporal</text><text class="t2" x="420.0" y="264.0" text-anchor="middle" dominant-baseline="central">status, timing</text></g><g class="g"><rect x="510" y="230" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="580.0" y="245.0" text-anchor="middle" dominant-baseline="central">warp · Git</text><text class="t2" x="580.0" y="264.0" text-anchor="middle" dominant-baseline="central">records, diffs</text></g><path class="w" d="M260 164 C 260 196, 100 196, 100 226" marker-end="url(#a)"/><path class="w" d="M310 164 L 270 226" marker-end="url(#a)"/><path class="w" d="M370 164 L 410 226" marker-end="url(#a)"/><path class="w" d="M420 164 C 420 196, 580 196, 580 226" marker-end="url(#a)"/><text class="f" x="340" y="316" text-anchor="middle">Writes reach Git only through loom's Record step; the UI only reads warp.</text></svg>
