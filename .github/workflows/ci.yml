name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: drawdown
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - name: sibling-bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
      - name: sibling-reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
      - name: sibling-pirn
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/pirn
          path: pirn
      - name: sibling-treadle
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/treadle
          path: treadle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/loom
          path: loom
      - uses: actions/setup-go@v5
        with:
          go-version-file: drawdown/go.mod
          cache-dependency-path: drawdown/go.sum
      - name: gofmt
        working-directory: drawdown
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: drawdown
        run: go vet ./...
      - name: test
        working-directory: drawdown
        run: go test -race ./...
      - name: invariants
        working-directory: drawdown
        run: bash .github/invariants.sh
      - uses: actions/setup-node@v4     # the ui and topbar steps: Node 22, as Contributing says (review 37)
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
      - name: ui
        # The page's pure logic (static/lib.js), with Node's own test runner.
        if: matrix.os == 'ubuntu-latest'
        working-directory: drawdown
        run: node --test ui/lib.test.js
      - name: topbar
        # The top bar in Chromium, through Playwright: each route marks its
        # section, the bar fits at 375 px in light and dark mode, counts
        # come only from answers it understands (ui/topbar.check.js).
        if: matrix.os == 'ubuntu-latest'
        working-directory: drawdown
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node ui/topbar.check.js
      - name: sri
        if: matrix.os == 'ubuntu-latest'
        working-directory: drawdown
        run: bash .github/sri.sh
