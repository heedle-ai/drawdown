name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: drawdown
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/loom
          path: loom
      - uses: actions/setup-go@v5
        with:
          go-version-file: drawdown/go.mod
          cache-dependency-path: drawdown/go.sum
      - name: gofmt
        working-directory: drawdown
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: drawdown
        run: go vet ./...
      - name: test
        working-directory: drawdown
        run: go test -race ./...
      - name: invariants
        working-directory: drawdown
        run: bash .github/invariants.sh
      - name: sri
        if: matrix.os == 'ubuntu-latest'
        working-directory: drawdown
        run: bash .github/sri.sh
