<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawdown</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css"
      integrity="sha384-iBvSlI3tNrrSIy7s6mvLg+5B2Z/QXbR4L0Pzg1nRf8zkXrz5JF316MLm2igMIpi2" crossorigin="anonymous">
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd; --card:#fff; --accent:#2f5d8a;
          --ok:#2e7d32; --bad:#b3261e; --run:#9a6700; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --muted:#9d9c95; --line:#2f2e2b; --card:#1e1e1c; --accent:#8db4dc;
            --ok:#7cc47f; --bad:#f28b82; --run:#e3b341; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; } header h1 a { color:inherit; text-decoration:none; }
  header .meta { color:var(--muted); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  textarea { width:100%; min-height:140px; font:14px/1.5 var(--mono); padding:12px; border:1px solid var(--line);
             border-radius:6px; background:var(--bg); color:var(--fg); resize:vertical; }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card);
           color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .error { color:var(--bad); font-family:var(--mono); font-size:13px; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  table.list { width:100%; border-collapse:collapse; font-size:14px; }
  table.list th, table.list td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.list th { color:var(--muted); font-weight:500; font-size:13px; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--bg); }
  code, pre, .mono { font-family:var(--mono); font-size:13px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; }
  .status { font-weight:600; font-size:13px; }
  .Completed { color:var(--ok); } .Running { color:var(--run); } .Recorded { color:var(--muted); }
  .Failed, .Terminated, .TimedOut, .Canceled { color:var(--bad); } .Merged { color:var(--accent); }
  select { font:13px var(--mono); padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .graph { overflow-x:auto; padding:8px 0; } .graph svg { max-width:100%; height:auto; }
  a { color:var(--accent); }
  .grid { display:grid; grid-template-columns: max-content 1fr; gap:4px 16px; font-size:14px; }
  .d2h-wrapper { font-size:13px; }
  .tree { list-style:none; margin:0; padding:0; } .tree li { display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:6px; }
  .tree li.current { background:var(--card); } .tree li a { margin-left:auto; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .crumbs { font-size:16px; margin:8px 0 4px; }
  .page { display:flex; gap:14px; align-items:flex-start; } .page img { width:280px; border:1px solid var(--line); border-radius:6px; }
  .live img { width:100%; max-width:960px; border:1px solid var(--line); border-radius:6px; margin-top:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"
        integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"
        integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html.min.js"
        integrity="sha384-1tVmtFdzvhqVP3vQWJmKYvD0uTtR0r+FhlLWw+vG6F/vNDS7yegNMNNHRS12fSyR" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
