<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawdown</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css"
      integrity="sha384-iBvSlI3tNrrSIy7s6mvLg+5B2Z/QXbR4L0Pzg1nRf8zkXrz5JF316MLm2igMIpi2" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css"
      integrity="sha384-bsaAhvdduZPAwUb7RRLRvDgtEtOsggrgjkr/EjPO1i/vdoi+DmdLaG79UOt6M5hD" crossorigin="anonymous">
<style>
  /* Fonts are served by drawdown itself (static/fonts, SIL Open Font License). */
  @font-face { font-family:"Bricolage Grotesque"; font-style:normal; font-weight:200 800; font-display:swap;
               src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2-variations"); }
  @font-face { font-family:"JetBrains Mono"; font-style:normal; font-weight:400; font-display:swap;
               src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-style:normal; font-weight:600; font-display:swap;
               src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2"); }

  :root {
    --paper:#eef1f6; --surface:#ffffff; --sunk:#f6f8fb; --ink:#1d2333; --muted:#5d6680; --line:#dbe0ea;
    --focus:#3b5bdb;
    /* Dyes: one per kind of step. */
    --echo:#8a8778; --source:#3b5bdb; --assess:#c2185b; --browse:#c98f00; --ask:#7a3fe0; --agent:#d4561f; --act:#1f6fb2;
    --container:#8d5a2b; --image:#5c8a12; --skill:#a1368f; --record:#0f8a6c; --other:#5d6680;
    /* Statuses. */
    --ok:#178a55; --run:#c98f00; --bad:#d23a2b; --rec:#64708a; --merge:#0f8fa8;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#141824; --surface:#1b2130; --sunk:#171c29; --ink:#e6e9f2; --muted:#98a1b8; --line:#2b3346;
      --focus:#8ea6ff;
      --echo:#b3b0a2; --source:#7d95ff; --assess:#f0628f; --browse:#f2c44b; --ask:#b28bff; --agent:#ff8a5c; --act:#64b5f6;
      --container:#c9925d; --image:#a9d94b; --skill:#e57ad0; --record:#3fcf9f; --other:#98a1b8;
      --ok:#3fcf8a; --run:#f2c44b; --bad:#ff7a6b; --rec:#98a1b8; --merge:#47c6dc;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 var(--sans); font-variation-settings:"wdth" 100; }
  a { color:var(--source); text-underline-offset:3px; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
  code, pre, .mono { font-family:var(--mono); font-size:12.5px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; }
  .muted { color:var(--muted); }

  /* Header */
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:var(--surface);
           border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .brand { display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; }
  .brand b { font-size:21px; font-weight:700; letter-spacing:-.02em; }
  .swatch { display:grid; grid-template-columns:repeat(4,6px); gap:2px; }
  .swatch i { width:6px; height:6px; border-radius:1.5px; }
  header .spacer { flex:1; }
  /* The top bar: sections, the current one underlined with a thread in its
     dye; counts of what needs you; Temporal last and quieter. */
  .topbar ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:2px; }
  .topbar ul a { position:relative; display:inline-flex; align-items:center; gap:6px; padding:6px 10px 8px; border-radius:8px;
                 color:var(--muted); text-decoration:none; font-weight:550; }
  .topbar ul a:hover { color:var(--ink); background:var(--sunk); }
  .topbar ul a.here { color:var(--ink); font-weight:650; }
  .topbar ul a.here::after { content:""; position:absolute; left:10px; right:10px; bottom:2px; height:3px; border-radius:2px; background:var(--c); }
  .topbar .need { min-width:18px; padding:0 5px; border-radius:999px; font-size:11.5px; font-weight:650; line-height:17px; text-align:center;
                  font-variant-numeric:tabular-nums; border:1px solid color-mix(in srgb, var(--run) 50%, transparent);
                  background:color-mix(in srgb, var(--run) 18%, var(--surface)); color:color-mix(in srgb, var(--run) 45%, var(--ink)); }
  /* A long agent name wraps rather than widening the page (review 37). */
  header .pill { white-space:normal; } header .pill .mono { overflow-wrap:anywhere; }
  header .temporal { color:var(--muted); font-size:13.5px; text-decoration:none; padding:4px 0 4px 16px; border-left:1px solid var(--line); }
  header .temporal:hover { color:var(--ink); text-decoration:underline; }
  @media (forced-colors: active) { .topbar ul a.here { text-decoration:underline; text-decoration-thickness:3px; } }
  @media (max-width: 640px) {
    /* Two rows: the brand, the history and Temporal; then the sections,
       the first label lined up with the brand. Temporal stays last for
       the keyboard. */
    header { padding:10px 16px 4px; gap:6px 12px; }
    header .spacer { display:none; }
    header label.pills > .muted { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    header .temporal { order:1; margin-left:auto; border-left:0; padding:4px 0; }
    .topbar { order:2; width:calc(100% + 12px); margin:0 -6px; }
    .topbar ul { justify-content:space-between; gap:0; }
    .topbar ul a { padding:6px 6px 9px; font-size:14px; gap:5px; }
    .topbar ul a.here::after { left:6px; right:6px; }
  }
  .agents-bar { display:flex; gap:6px; flex-wrap:wrap; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 72px; }
  h2 { font-size:19px; font-weight:650; letter-spacing:-.01em; margin:34px 0 4px; }
  h2 + .lede { margin:0 0 12px; color:var(--muted); font-size:14px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .cols { display:grid; grid-template-columns:minmax(0, 320px) minmax(0, 1fr); gap:20px; align-items:start; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }

  /* Pills */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 8px; border-radius:999px; font-size:12.5px;
          font-weight:550; line-height:20px; white-space:nowrap; border:1px solid color-mix(in srgb, var(--c) 35%, transparent);
          background:color-mix(in srgb, var(--c) 13%, var(--surface)); color:color-mix(in srgb, var(--c) 78%, var(--ink)); }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c); flex:none; }
  .pill.plain::before { display:none; } .pill.plain { padding-left:10px; }
  .pill.mono { font-family:var(--mono); font-size:11.5px; font-weight:400; }
  .pill.big { font-size:14px; padding:4px 14px 4px 11px; } .pill.big::before { width:9px; height:9px; }
  button.pill { cursor:pointer; font-family:inherit; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .s-Completed { --c:var(--ok); } .s-Running { --c:var(--run); } .s-Recorded { --c:var(--rec); } .s-Merged { --c:var(--merge); }
  .s-Failed, .s-Terminated, .s-TimedOut, .s-Canceled { --c:var(--bad); } .s-Abandoned { --c:var(--muted); } .s-Scheduled { --c:var(--muted); } .s-Unknown { --c:var(--muted); }
  .k-echo { --c:var(--echo); } .k-source { --c:var(--source); } .k-assess { --c:var(--assess); } .k-browse { --c:var(--browse); }
  .k-ask { --c:var(--ask); } .k-agent { --c:var(--agent); } .k-act { --c:var(--act); } .k-container { --c:var(--container); } .k-image { --c:var(--image); } .k-skill { --c:var(--skill); } .k-record { --c:var(--record); } .k-other { --c:var(--other); }
  .f-added { --c:var(--ok); } .f-changed { --c:var(--run); } .f-deleted { --c:var(--bad); } .f-same { --c:var(--muted); }
  .files { padding:4px 0; } .file-row { border-bottom:1px solid var(--line); } .file-row:last-child { border-bottom:0; }
  .file-head { display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:0; border-radius:0; padding:8px 14px; }
  .file-head:disabled { cursor:default; opacity:1; } .file-head code { overflow-wrap:anywhere; flex:1; }
  .file-body { margin:0 14px 12px; max-height:420px; overflow:auto; }
  /* Git names a blob diff's sides by their hashes; the row names the file. */
  .file-body .d2h-file-header { display:none; }
  .skills { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .skill-card { display:block; color:inherit; text-decoration:none; } .skill-card:hover { border-color:var(--skill); }
  .skill-card p { margin:10px 0 0; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .skill-card p.muted { display:block; }
  .skill-cols { display:grid; grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); gap:24px; }
  @media (max-width: 860px) { .skill-cols { grid-template-columns:1fr; } }
  .skill-md { white-space:pre-wrap; overflow-wrap:anywhere; max-height:520px; overflow:auto; margin:0; }
  .versions { padding-left:20px; } .versions li { margin:4px 0; } .versions a[aria-current] { font-weight:700; }
  .registry-file pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  .s-Running.pill::before { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }

  /* Buttons and editor */
  button { font:inherit; font-size:14px; padding:7px 14px; border-radius:8px; border:1px solid var(--line);
           background:var(--surface); color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { border-color:color-mix(in srgb, var(--ink) 30%, var(--line)); }
  button.primary { background:var(--ink); border-color:var(--ink); color:var(--surface); font-weight:600; padding:7px 20px; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  textarea { width:100%; min-height:150px; font:13.5px/1.6 var(--mono); padding:12px 14px; border:1px solid var(--line);
             border-radius:10px; background:var(--sunk); color:var(--ink); resize:vertical; }
  .error { color:var(--bad); font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; }
  input[type=text] { font:13.5px var(--mono); padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--sunk); color:var(--ink); min-width:0; }
  .add-skill .tabs { display:flex; gap:4px; margin-bottom:12px; }
  .add-skill .tabs button[aria-selected="true"] { border-color:var(--skill); color:var(--ink); font-weight:600; }
  .add-skill label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); flex:1 1 220px; }
  .add-skill textarea { min-height:120px; }
  .describe label { font-weight:600; }
  .describe input[type=text] { min-width:240px; }
  .decide { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  button.reject { color:var(--bad); }
  button.link { border:none; background:none; padding:0; color:var(--source); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font:inherit; }
  select { font:12.5px var(--mono); padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }

  /* Programs, highlighted (roadmap 9.4). One tokenizer (DD.tokens, draft's
     lexer) colours the viewer (.prog) and the editor (.ed) alike. Brackets
     take their depth's thread colour, four in turn, each at least 4.5:1 on
     --surface and --sunk in both modes; the form under a bracket being
     pointed at, focused or next to the cursor takes a tint of it. */
  .prog, .ed { --d0:#4a5f9e; --d1:#2b7368; --d2:#8c4a7f; --d3:#7a6514; --hc:transparent; }
  @media (prefers-color-scheme: dark) { .prog, .ed { --d0:#9db0ee; --d1:#6fc8ba; --d2:#dc9ad0; --d3:#d1bb62; } }
  .d0 { --dc:var(--d0); } .d1 { --dc:var(--d1); } .d2 { --dc:var(--d2); } .d3 { --dc:var(--d3); }
  .prog .p, .ed .p { color:var(--dc); font-weight:600; }
  .prog .comb, .ed .comb { font-weight:600; color:var(--ink); }
  .prog .cmd, .ed .cmd { font-weight:600; color:color-mix(in srgb, var(--c) 85%, var(--ink)); }
  .prog .sk, .ed .sk { font-weight:600; color:color-mix(in srgb, var(--skill) 85%, var(--ink));
                       text-decoration:underline dotted color-mix(in srgb, var(--skill) 60%, transparent); text-underline-offset:3px; }
  .prog .str, .ed .str { color:var(--ink); }
  .prog .cm, .ed .cm { color:var(--muted); font-style:italic; }
  /* The tints are light enough that every colour on them keeps 4.5:1 (review 38; ui/lib.test.js checks). */
  .prog .in, .ed .CodeMirror-focused .in { background:color-mix(in srgb, var(--hc) 8%, transparent); }
  .prog .hot, .ed .CodeMirror-focused .hot { background:color-mix(in srgb, var(--dc) 10%, transparent); border-radius:3px;
                         box-shadow:0 0 0 1px color-mix(in srgb, var(--dc) 60%, transparent); }
  .prog .unmatched, .ed .unmatched, .prog .bad, .ed .bad { color:color-mix(in srgb, var(--bad) 85%, var(--ink)); background:color-mix(in srgb, var(--bad) 10%, transparent);
                         text-decoration:underline wavy var(--bad); text-underline-offset:3px; text-decoration-skip-ink:none; }
  .prog a.url, .prog a.grant { color:inherit; text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--source) 70%, transparent); text-underline-offset:3px; }
  .prog a.grant { text-decoration-style:dotted; }
  .prog .why { cursor:help; text-decoration:underline dotted color-mix(in srgb, var(--muted) 70%, transparent); text-underline-offset:3px; }
  .prog-box { display:flow-root; }
  pre.prog { font:12.5px/1.65 var(--mono); tab-size:2; }
  pre.prog:focus-visible { outline-offset:4px; }
  .prog .ln { display:block; min-height:1.65em; padding-left:var(--hang); text-indent:calc(-1 * var(--hang)); }
  .prog .more { font:600 11px/1.5 var(--sans); padding:0 8px; margin-left:6px; border-radius:999px; text-indent:0; vertical-align:1px;
                color:var(--muted); user-select:none; }
  .prog-copy { float:right; margin:0 0 4px 10px; font:600 11.5px/1.5 var(--sans); padding:2px 10px; border-radius:999px; color:var(--muted); }
  .ed { position:relative; min-width:0; }
  .ed .CodeMirror { height:auto; min-height:150px; font:13.5px/1.6 var(--mono); padding:8px 4px; border:1px solid var(--line);
                    border-radius:10px; background:var(--sunk); color:var(--ink); }
  .ed .CodeMirror-focused { outline:2px solid var(--focus); outline-offset:2px; }
  .ed .CodeMirror-code:focus-visible { outline:none; } /* the editor's own ring, above, shows focus */
  .ed .CodeMirror-lines { min-height:132px; }
  .ed .CodeMirror-cursor { border-left:1.5px solid var(--ink); }
  .ed .CodeMirror-selected, .ed .CodeMirror-focused .CodeMirror-selected, .ed .CodeMirror-line::selection, .ed .CodeMirror-line > span::selection,
  .ed .CodeMirror-line > span > span::selection { background:color-mix(in srgb, var(--focus) 24%, transparent); }
  .ed .CodeMirror-line { padding:0 10px; }
  /* Any character may break a long run, so the editor never widens the page (review 38).
     Specific enough to win over CodeMirror's own .CodeMirror-wrap pre.CodeMirror-line. */
  .ed .CodeMirror-wrap pre.CodeMirror-line, .ed .CodeMirror-wrap pre.CodeMirror-line-like { overflow-wrap:anywhere; }
  .ed .CodeMirror-scroll { max-height:70vh; } /* so CodeMirror draws only the lines in view (review 38) */
  .ed .CodeMirror pre.CodeMirror-line, .ed .CodeMirror pre.CodeMirror-line-like { font:inherit; }
  .ed-empty { position:absolute; left:15px; top:9px; color:var(--muted); font:13.5px/1.6 var(--mono); pointer-events:none; }
  .ed-keys { font-size:12.5px; margin-top:6px; }

  /* The drawdown: recent runs, woven */
  .weave-wrap { overflow-x:auto; padding:4px 2px 2px; }
  .weave { display:flex; gap:3px; align-items:flex-start; min-height:40px; }
  .warp { display:flex; flex-direction:column; gap:3px; }
  
  .warp .selvedge { width:20px; height:7px; border-radius:2px; background:var(--c); }
  .cell { width:20px; height:20px; border-radius:4px; background:var(--c); transition:transform .12s; }
  .cell.empty { background:transparent; }
  .s-Running .cell { background-image:repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--surface) 45%, transparent) 3px 6px); }
  .weave-row { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .weave-row .weave-wrap { flex:1 1 360px; min-width:0; }
  .weave-sum { flex:0 1 330px; display:flex; flex-direction:column; gap:10px; }
  .cal { flex:0 0 auto; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:13px; }
  .cal-nav { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; width:28px; height:26px; cursor:pointer; display:inline-grid; place-items:center; padding:0; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 26px); gap:3px; }
  .cal-dow { font-size:10.5px; color:var(--muted); text-align:center; }
  .cal-day { width:26px; height:26px; border-radius:5px; border:0; padding:0; font:11px var(--mono); color:var(--muted);
             background:var(--sunk); cursor:default; position:relative; }
  .cal-day.cal-out { color:color-mix(in srgb, var(--muted) 55%, transparent); }
  .cal-day.cal-has { cursor:pointer; }
  .cal-day.cal-failed::after { content:""; position:absolute; right:3px; top:3px; width:6px; height:6px; border-radius:50%; background:var(--bad); }
  .cal-day.cal-today { box-shadow:inset 0 0 0 1.5px var(--muted); }
  .cal-day.cal-on { outline:2px solid var(--ink); outline-offset:1px; cursor:pointer; }
  .cal-day.cal-has:hover, .cal-day.cal-has:focus-visible { transform:scale(1.12); }
  .filter-note { margin:-4px 0 10px; font-size:13.5px; }
  .catalog { margin-top:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .catalog-head { display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--sunk); border-bottom:1px solid var(--line); }
  .catalog-list { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; }
  .catalog-list li { display:grid; grid-template-columns:minmax(150px, 220px) minmax(0, 1fr) auto; gap:4px 14px; align-items:baseline; padding:7px 12px; border-top:1px solid var(--line); font-size:13px; }
  .catalog-list li:first-child { border-top:0; }
  .catalog-list label { display:flex; flex-direction:row; gap:8px; align-items:baseline; cursor:pointer; margin:0; }
  .catalog-name { font-weight:600; }
  .catalog-desc { color:var(--muted); min-width:0; }
  .catalog-text { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .catalog-bad { opacity:.75; }
  .catalog-state { justify-self:end; white-space:nowrap; }
  .catalog-note { display:block; color:var(--run); font-size:12px; }
  .catalog-state .catalog-note { display:inline; }
  .chain { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .chain-link { display:inline-flex; flex-direction:column; align-items:flex-start; gap:3px; font-size:12px; border:0; background:none; padding:0; color:inherit; font-family:inherit; }
  button.chain-link { cursor:pointer; } button.chain-link:hover .pill { outline:2px solid var(--record); }
  .chain-arrow { color:var(--muted); font-size:18px; }
  .big-num { font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .big-num span { font-size:14px; font-weight:500; letter-spacing:0; color:var(--muted); }
  .legend { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }

  /* Agents */
  .tree { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .tree li { display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:8px; }
  .tree li.current { background:var(--sunk); box-shadow:inset 3px 0 0 var(--c); }
  .tree li .open { margin-left:auto; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; background:var(--c); }

  /* Runs table */
  table.list { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
  table.list th { text-align:left; color:var(--muted); font-weight:500; font-size:13px; padding:6px 12px; }
  table.list td { padding:10px 12px; border-top:1px solid var(--line); vertical-align:top; }
  tr.click { cursor:pointer; } tr.click:hover td, tr.click:focus-visible td { background:var(--sunk); }
  .durbar { height:6px; border-radius:3px; background:color-mix(in srgb, var(--c) 70%, transparent); min-width:3px; margin-top:6px; }

  /* Timeline */
  .timeline { display:grid; grid-template-columns:minmax(110px, 180px) 1fr; gap:6px 14px; align-items:center; }

  /* The front door: Ask heedle */

  .cg-links { display:flex; gap:2px; border-top:1px solid var(--line); padding-top:5px; margin-top:2px; }
  .cg-icon { display:inline-grid; place-items:center; width:26px; height:24px; border-radius:6px; color:var(--muted); }
